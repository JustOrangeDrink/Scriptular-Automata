<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <title>Scriptular Automata</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
  </head>
  <body>
    <script src="Scripts/simulation.js" type="module"></script>
    <div class="outer_layer">
      <div class="simulation_outer_layer">
        <div class="simulation">
          <canvas></canvas>
        </div>
      </div>
      <div class="controle_panel">
        <div class="range_wrapper">
          <label for="rendering_speed_input">Rendering Speed</label>
          <input
            type="range"
            class="rendering_speed_input"
            id="rendering_speed_input"
            min="20"
            max="320"
            value="20"
            step="100"
          />
        </div>
        <div class="range_wrapper">
          <label for="cells_amount_input">Cells Amount</label>
          <input
            type="range"
            class="cells_amount_input"
            id="cells_amount_input"
            min="1"
            max="5000"
            step="1"
          />
        </div>
        <div class="button_wrapper">
          <input
            type="button"
            class="button spawn_button"
            value="Add More Life"
          />
        </div>
        <div class="button_wrapper">
          <input
            type="button"
            class="button kill_button"
            value="Kill All Life"
          />
        </div>
      </div>
    </div>
  </body>
</html>
